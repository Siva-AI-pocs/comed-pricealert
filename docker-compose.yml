name: comed-pricealert

networks:
  sentinelone-portal_s1net:
    external: true

services:
  app:
    container_name: comed-pricealert
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://s1bot:changeme@postgres:5432/comed_pricealert}
    ports:
      - "8005:8000"
    networks:
      sentinelone-portal_s1net:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
